<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sourire — suivi orthodontique</title>
<meta name="description" content="Suis ton traitement orthodontique en photos et montre l'évolution à ton orthodontiste. Tes photos restent sur ton appareil.">
<meta name="theme-color" content="#F7F1E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sourire">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">Sourire<span>.</span></div>
  <button class="who" data-action="profiles" aria-label="Changer de profil"><span id="whoName">—</span><svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabs" aria-label="Navigation">
  <button data-tab="home" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></button>
  <button data-tab="photos"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg><span>Photos</span></button>
  <button data-tab="compare"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M12 3v18M8 10l-2 2 2 2M16 10l2 2-2 2"/></svg><span>Comparer</span></button>
  <button data-tab="suivi"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg><span>Suivi</span></button>
  <button data-tab="share"><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg><span>Cabinet</span></button>
</nav>

<dialog id="sheet"><form method="dialog" id="sheetForm"></form></dialog>
<div id="viewer" hidden></div>
<div id="report"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
